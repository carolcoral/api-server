server:
  port: ${SERVER_PORT:8080}

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      enabled: true
      show-details: always
    prometheus:
      enabled: true
  health:
    defaults:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: api-server

spring:
  profiles:
    active: ${DB_TYPE:sqlite}  # 通过环境变量切换数据库：sqlite | mysql | postgresql
  application:
    name: api-server
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

# Swagger配置（已关闭，流式SSE端点已加@Hidden注解避免类型扫描报错）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# JWT配置（HS512算法需要至少512位=64字节的密钥）
jwt:
  secret: ${JWT_SECRET:scbcnlsue#TVYbxka73bdlyabjj63glbod4vjb^FRIGBbja63jku^FXYZ123456789ABC}  # 生产环境必须通过环境变量设置强密钥
  expiration: ${JWT_EXPIRATION:86400000} # 24小时（毫秒），可通过环境变量配置

# API Server配置
mock:
  server:
    default-response-delay: 0 # 默认响应延迟（毫秒）
    enable-request-log: true # 是否记录请求日志

# 日志配置
logging:
  level:
    com.carolcoral.apiserver: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:./logs/api-server.log}

# 管理账号配置（首次启动时创建）
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:!CHANGE_ME!}  # 默认密码，生产环境建议通过环境变量设置
  email: ${ADMIN_EMAIL:admin@apiserver.com}
