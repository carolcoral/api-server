# ========================================
# 全局质量门禁（Quality Gate）—— 单一事实来源
# ========================================
# 本文件是全仓库**唯一**的质量门禁配置来源：所有流水线、NPC、开发者
# 都必须以本文件为准，不得在别处另立阈值。
#
# 变更本文件（尤其 thresholds）属于「全局设置」变更，必须：
#   1. 在 Issue / PR 中明确说明变更理由与影响面
#   2. 同步更新 docs/ENGINEERING-RULES.md 与 CHANGELOG.md
#   3. 由仓库管理员评审通过
# ========================================

version: 1

# 覆盖率门禁（红线：低于即阻断，不允许 waive）
coverage:
  # 分支覆盖率（后端必须，见 backend/must 说明）
  branch:
    minimum: 75
    # 是否强制：true = 未达标阻断流水线
    enforced: true
  # 单元（行）覆盖率
  line:
    minimum: 80
    enforced: true
  # 作用范围说明：
  #   - 后端（backend/）：分支 ≥ 75% 且 行 ≥ 80%（本 Issue 明确要求「后端才需要加上这句话」）
  #   - 前端（frontend/）：行 ≥ 80%，分支 ≥ 75%（同标准执行，统计范围为可单测逻辑层）
  scope:
    backend:
      branch: 75
      line: 80
      must: true          # 后端必须加分支覆盖率门禁
    frontend:
      branch: 75
      line: 80
      must: false         # 前端默认同标准执行，可按需调整

# 每次提交必须保证的两项检查
submission:
  # 代码稳定性检查：单测全绿 + 构建通过
  stability:
    required: true
    checks:
      - 后端单元测试全部通过（mvn test，禁止 -DskipTests 绕过）
      - 前端单元测试全部通过（npm run test:run）
      - 前后端构建通过（mvn package / npm run build）
  # 代码一致性检查：Lint / 格式 / 覆盖率阈值 / 完整性
  consistency:
    required: true
    checks:
      - 前端 ESLint 通过（npm run lint）
      - 覆盖率阈值达标（本文件 coverage 段）
      - 分支保护状态检查必须为 success 才能合并
      - 提交信息遵循 Conventional Commits

# 记忆体（长期约束）：本文件被 .cnb.yml 注入到 NPC 上下文，
# 使门禁规则对每次 NPC 任务持续生效，无需重复声明。
memory:
  inject: true
  description: 门禁规则属长期约束，NPC 每次执行任务前需先读取本文件
