# ========================================
# 云原生开发环境配置
# ========================================
# 使用 CNB 官方云原生开发环境基础镜像 cnbcool/default-dev-env
# 该镜像已包含 JDK、Maven、Node.js 等完整开发工具链
# 代码通过 git clone 自动挂载到 /workspace
# .codebuddy、session、终端历史等通过 volumes 持久化挂载
# 服务本身不需要构建镜像，直接在开发环境中运行
# ========================================
$:
  vscode:
    - docker:
        # CNB 云原生开发环境基础镜像（内置 JDK、Maven、Node.js 等）
        image: cnbcool/default-dev-env
      services:
        - vscode
        - docker
      # 持久化挂载卷：保存 CodeBuddy 数据、session、终端历史等
      # 关闭开发环境后数据不丢失，下次打开自动恢复
      volumes:
        # CodeBuddy AI 助手数据（skills、plugins、对话历史、记忆等）
        - /root/.codebuddy
        # CodeBuddy 项目级数据（team 协作配置等）
        - /workspace/.codebuddy
        # VS Code Server 数据（extensions、settings、state 等）
        - /root/.vscode-server
        # Shell 历史记录
        - /root/.bash_history
        # Maven 本地仓库缓存（加速后续构建）
        - /root/.m2
        # npm 缓存（加速前端依赖安装）
        - /root/.npm
      # 环境变量
      env:
        TZ: Asia/Shanghai
        LANG: C.UTF-8
      # 端口映射（开发调试用）
      ports:
        - 8080  # Spring Boot 后端
        - 5173  # Vite 前端开发服务器

  # ---- 质量门禁流水线（全局设置，阈值见 .cnb/quality-gate.yml）----
  pull_request:
    - name: quality-gate
      docker:
        image: cnbcool/default-dev-env
      stages:
        # ---------- 后端：单元测试 + 覆盖率门禁（分支 75% / 行 80%） ----------
        - name: backend-test
          script: |
            set -e
            cd backend
            mvn -B -ntp verify
            echo "✓ 后端单元测试通过，Jacoco 覆盖率门禁达标（分支 ≥ 75% / 行 ≥ 80%）"
        - name: backend-coverage
          type: testing:coverage
          options:
            key: backend
            name: 后端覆盖率
            pattern: backend/target/site/jacoco/jacoco.xml
            lines: 80
            diffLines: 80
            breakIfNoCoverage: true
        # ---------- 前端：单元测试 + 覆盖率门禁（分支 75% / 行 80%） ----------
        - name: frontend-test
          script: |
            set -e
            cd frontend
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
            npm run test:coverage
            echo "✓ 前端单元测试通过，覆盖率门禁达标（分支 ≥ 75% / 行 ≥ 80%）"
        - name: frontend-coverage
          type: testing:coverage
          options:
            key: frontend
            name: 前端覆盖率
            pattern: frontend/coverage/coverage-final.json
            lines: 80
            diffLines: 80
            breakIfNoCoverage: true
        # ---------- 稳定性检查：前后端构建必须通过 ----------
        - name: stability-build
          script: |
            set -e
            cd frontend && npm run build
            cd ../backend && mvn -B -ntp -DskipTests package
            echo "✓ 稳定性检查通过：前后端构建成功"
        # ---------- 一致性检查：Lint / 提交信息规范 ----------
        - name: consistency-check
          script: |
            set -e
            cd frontend
            npm run lint || { echo "✗ 一致性检查失败：ESLint 未通过"; exit 1; }
            cd ..
            MSG=$(git log -1 --pretty=%s)
            echo "最新提交信息：$MSG"
            echo "$MSG" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+' \
              || { echo "✗ 一致性检查失败：提交信息需遵循 Conventional Commits"; exit 1; }
            echo "✓ 一致性检查通过"

  push:
    - name: quality-gate
      docker:
        image: cnbcool/default-dev-env
      stages:
        - name: backend-test
          script: |
            set -e
            cd backend
            mvn -B -ntp verify
        - name: backend-coverage
          type: testing:coverage
          options:
            key: backend
            name: 后端覆盖率
            pattern: backend/target/site/jacoco/jacoco.xml
            lines: 80
            breakIfNoCoverage: true
        - name: frontend-test
          script: |
            set -e
            cd frontend
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
            npm run test:coverage
        - name: frontend-coverage
          type: testing:coverage
          options:
            key: frontend
            name: 前端覆盖率
            pattern: frontend/coverage/coverage-final.json
            lines: 80
            breakIfNoCoverage: true


# ========================================
# 质量门禁（Quality Gate）
# ========================================
# 全局设置：分支覆盖率 ≥ 75%、单元（行）覆盖率 ≥ 80%，每次提交必须通过
# 稳定性与一致性检查。阈值单一来源见 .cnb/quality-gate.yml。
#
# 说明：
# - 后端（含分支覆盖率门禁，见 Issue 要求「后端才需要加上这句话」）
# - 前端（同标准执行，统计范围为可单测逻辑层 src/{utils,stores,api,composables}）
# - 覆盖率红线由本地测试命令与 testing:coverage 双重把关：
#     本地：mvn verify（jacoco check 失败即断）/ vitest --coverage（阈值失败即断）
#     CI  ：testing:coverage 内置任务解析报告并上报徽章，低于红线阻断流水线
# ========================================
# ========================================
# 自动同步到 GitHub
# ========================================
# 每次新增 tag 时，自动将代码推送到 GitHub 镜像仓库。
# GITHUB_TOKEN 从 CNB 密钥仓库获取：
#   https://cnb.cool/xindu.site/secret/-/blob/main/token.yaml
# ========================================
main:
  tag_push:
    - imports: https://cnb.cool/xindu.site/secret/-/blob/main/token.yaml
      stages:
        - name: sync-to-github
          image: cnbcool/git-auto-tag:latest
          script:
            - git config --global user.email "cnb@sync.bot"
            - git config --global user.name "CNB Sync Bot"
            - |
              set -e
              git remote remove github 2>/dev/null || true
              git remote add github "https://${GITHUB_TOKEN}@github.com/carolcoral/api-server.git"
              git push github --mirror
  web_trigger_sync_to_github:
    - imports: https://cnb.cool/xindu.site/secret/-/blob/main/token.yaml
      stages:
        - name: sync-to-github
          image: cnbcool/git-auto-tag:latest
          script:
            - git config --global user.email "cnb@sync.bot"
            - git config --global user.name "CNB Sync Bot"
            - |
              set -e
              git remote remove github 2>/dev/null || true
              git remote add github "https://${GITHUB_TOKEN}@github.com/carolcoral/api-server.git"
              git push github --mirror